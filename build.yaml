# Local build target catalog. GitHub Actions uses build-ci.yaml.
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
# Local catalog: choose the matching keyboard-module branch before building.
# tcherta_* requires tcherta_shield_0; plenka_* requires plenka_1.
# build-ci.yaml includes only shields available at its manifest revision.
include:
  - board: nice_nano_v2
    shield: settings_reset
  - board: nice_nano_v2
    shield: tester_pro_micro
  - board: nice_nano_v2
    shield: plenka_left
  - board: nice_nano_v2
    shield: plenka_right
  - board: nice_nano_v2
    shield: tcherta_left
  - board: nice_nano_v2
    shield: tcherta_right

#  - board: tcherta_left
#    shield: nice_view nice_view_adapter
#  - board: tcherta_right
#    shield: nice_view nice_view_adapter
